# Every board's firmware, built from the tagged sources and attached to the
# release when it is published:
#   v90d-ht802fw.bin   the Grandstream HT802 (all revisions the loader knows)
#   v90d-ht801fw.bin   the Grandstream HT801: the same system, named and keyed
#                      for the HT801's stock upgrade page (BOARDS.md)
#   v90d-obi200.fw     the Obihai OBi200, built from the community firmware
#                      (fw/obi/getbase.sh fetches it, checked by SHA-256)
#   SHA256SUMS
# Everything the build fetches is pinned by SHA-256 (fw/setup.sh,
# fw/obi/getbase.sh). The host test suites run first; a failure leaves the
# release without files rather than with untested ones.
# A release published without its files (a failed run) can be built again
# from the Actions tab: "Run workflow" with the tag.
name: release

on:
  # every push to main: the whole build and its tests, nothing attached
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "the release tag to build and attach to, e.g. v0.9.0"
        required: true

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.sha }}

      - name: Host packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc bison flex libssl-dev libelf-dev \
            cpio xz-utils bzip2 lz4 python3 curl squashfs-tools

      - name: Downloads (cached by their pins)
        uses: actions/cache@v4
        with:
          path: |
            fw/dl
            toolchain/*.tar.bz2
            fw/obi/dl
          key: dl-${{ hashFiles('fw/setup.sh', 'fw/obi/getbase.sh') }}

      - name: Set up (toolchain, Linux, busybox, OpenVPN, libv90modem)
        run: sh fw/setup.sh

      - name: Host tests
        run: |
          make -C fw/drv test
          make -C cfg test
          make -C srv test

      - name: The version is the tag
        if: env.TAG != ''
        run: |
          v=$(cat fw/VERSION)
          [ "v$v" = "$TAG" ] || { echo "fw/VERSION says $v, the tag is $TAG"; exit 1; }

      - name: HT802 / HT801 image
        run: |
          make -C fw release
          cp fw/build/release/v90d-ht802fw.bin fw/build/release/v90d-ht801fw.bin .

      - name: OBi200 image (and its tests)
        run: |
          BASE=$(sh fw/obi/getbase.sh)
          make -C fw/obi test BASE="$BASE"
          cp fw/obi/build/v90d-obi200.fw .

      - name: Attach to the release
        if: env.TAG != ''
        run: |
          sha256sum v90d-ht802fw.bin v90d-ht801fw.bin v90d-obi200.fw > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" v90d-ht802fw.bin v90d-ht801fw.bin v90d-obi200.fw SHA256SUMS --clobber

      - name: Download links in the release notes
        if: env.TAG != ''
        run: |
          # a "Downloads" block between markers, replaced on a run again
          u="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          gh release view "$TAG" --json body -q .body > notes.md
          python3 - "$u" <<'EOF'
          import re, sys
          u = sys.argv[1]
          sums = dict(reversed(l.split()) for l in open("SHA256SUMS") if l.strip())
          rows = [("v90d-ht802fw.bin", "Grandstream HT802 (V2.5A, V1.6A)"),
                  ("v90d-ht801fw.bin", "Grandstream HT801 (untested)"),
                  ("v90d-obi200.fw", "Obihai OBi200 on the community firmware (fw/obi/README.md)"),
                  ("SHA256SUMS", "the checksums")]
          block = ["<!-- downloads -->", "### Downloads", "", "| file | for | sha256 |", "|---|---|---|"]
          block += ["| [`%s`](%s/%s) | %s | %s |" % (f, u, f, what, "`%s`" % sums[f] if f in sums else "")
                    for f, what in rows]
          block = "\n".join(block + ["<!-- /downloads -->"])
          body = open("notes.md").read()
          body = re.sub(r"\n*<!-- downloads -->.*?<!-- /downloads -->", "", body, flags=re.S).rstrip()
          open("notes.md", "w").write(body + "\n\n" + block + "\n")
          EOF
          gh release edit "$TAG" --notes-file notes.md
